[build]
  # Static site — nothing to compile. Netlify publishes the repo root as-is.
  # Functions provide the first-party analytics collector and admin API.
  publish = "."
  command = ""
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Photos are content-stable and fingerprinted by filename — cache them hard.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The page itself should always revalidate so edits go live immediately.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Admin dashboard: never cached, never indexed. Access is gated by the
# ADMIN_PASSWORD environment variable, checked server-side in /api/stats —
# the page itself holds no data until it authenticates.
[[headers]]
  for = "/admin.html"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive"

# Analytics endpoints must never be cached by the CDN.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

# Friendlier URL for the dashboard.
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
